# Reverse-proxy configuration for PumaPanel.
#
# Mounted into the `nginx` service (see `compose.yaml`) in place of the image's
# default `conf.d` directory. It listens on port 80 only: by default TLS is
# terminated by an upstream proxy or load balancer. See DEPLOYMENT.md to enable
# TLS directly in nginx.
#
# Validate a change with:
#   docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 \
#     -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" nginx:1.29-alpine nginx -t

# Preserve the client's upgrade intent. The application does not currently
# expose WebSocket endpoints, but this keeps the upstream compatible if one is
# added and is harmless otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pumapanel_web {
    server web:3000;
}

upstream pumapanel_api {
    server api:3001;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Match this to the largest request body the application should accept.
    client_max_body_size 10m;

    # Response security headers. HSTS is intentionally omitted here because TLS
    # is terminated upstream; add it alongside the TLS server block if you
    # terminate TLS in nginx.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API --------------------------------------------------------------
    # The trailing slash on `proxy_pass` strips the `/api/` prefix, so
    # `/api/health` reaches the API as `/health`.
    location /api/ {
        proxy_pass http://pumapanel_api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # --- Web --------------------------------------------------------------
    location / {
        proxy_pass http://pumapanel_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }
}

