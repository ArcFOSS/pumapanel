$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"
tags:
  - next
  - frontend

tasks:
  dev:
    command: "pnpm dev"
    preset: "server"

  build:
    command: "pnpm build"
    inputs:
      - "src/**/*"
      - "public/**/*"
      - "package.json"
      - "components.json"
      - "next.config.*"
      - "tsconfig.json"

  start:
    command: "pnpm start"
    preset: "server"

  lint:
    command: "pnpm lint"

  test:
    command: "pnpm test"
    inputs:
      - "src/**/*"
      - "public/**/*"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.*"
      - "vitest.setup.ts"

  typecheck:
    # `next typegen` emits the route/`LayoutProps` declarations that `tsc`
    # consumes, so type-checking also works on a clean checkout (CI, fresh
    # clone) without a prior `next dev`/`next build`.
    script: "pnpm exec next typegen && pnpm exec tsc --noEmit"
