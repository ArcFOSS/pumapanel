$schema: "https://moonrepo.dev/schemas/project.json"

language: "rust"
layer: "application"
tags:
  - rust
  - backend
  - api

tasks:
  dev:
    command: "cargo run"
    preset: "server"

  build:
    command: "cargo build --release"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".cargo/config.toml"

  test:
    command: "cargo test"

  lint:
    command: "cargo clippy --all-targets --all-features -- -D warnings"

  typecheck:
    command: "cargo check --all-targets"
