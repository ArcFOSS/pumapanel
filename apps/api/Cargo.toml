[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
# The agent crate owns the container-management wire types, so the API and the
# agent share one definition of the protocol between them instead of each
# declaring its own. Only `agent::wire` (and the memory bounds) are used here;
# the daemon's runtime code is never called from the API.
agent = { path = "../agent" }
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
cookie = "0.18.2"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rayon = "1.12.0"
# `rustls` keeps the image free of an OpenSSL system dependency.
reqwest = { version = "0.12.24", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
tokio = { version = "1.53.2", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
] }
uuid = { version = "1.28.0", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
# `time` is only used to let the PaperMC cache expire in a test.
tokio = { version = "1.53.2", features = ["time"] }
tower = { version = "0.5.2", features = ["util"] }
