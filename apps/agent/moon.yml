$schema: "https://moonrepo.dev/schemas/project.json"

language: "rust"
layer: "application"
# Classified as `systems` (a low-level host daemon) rather than `backend` so the
# API -> agent project dependency is allowed under moon's layer constraints.
# See the note in `apps/api/moon.yml` for the full explanation.
stack: "systems"
tags:
  - rust
  - backend
  - agent

tasks:
  dev:
    command: "cargo run"
    preset: "server"

  build:
    command: "cargo build --release"
    inputs:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"

  test:
    command: "cargo test"

  lint:
    command: "cargo clippy --all-targets --all-features -- -D warnings"

  typecheck:
    command: "cargo check --all-targets"
