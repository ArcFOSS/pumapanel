[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
